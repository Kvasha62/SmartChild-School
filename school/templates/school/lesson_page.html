{% extends "school/base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<article class="lesson lesson-page">
  <p class="eyebrow">
    <a href="{% pageurl page.get_parent %}">Все материалы</a>
    / {{ page.get_direction_display }}
  </p>

  <h1>{{ page.title }}</h1>

  {% if page.intro %}
  <p class="lesson-intro">{{ page.intro }}</p>
  {% endif %}

  <div class="lesson-body">
    {{ page.body|richtext }}
  </div>

  {% if page.video_embed_url %}
  <div class="lesson-video">
    <iframe src="{{ page.video_embed_url }}" title="Видео к уроку {{ page.title }}" allow="clipboard-write; autoplay"
      allowfullscreen>
    </iframe>
  </div>
  {% endif %}
</article>
{% endblock %}
