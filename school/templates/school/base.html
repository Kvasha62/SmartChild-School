{% load static wagtailcore_tags %}
<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="{% if page.search_description %}{{ page.search_description }}{% elif page.intro %}{{ page.intro|truncatechars:170 }}{% else %}Учебные материалы SmartChild-School по программированию и подготовке к ОГЭ и ЕГЭ.{% endif %}">
  {% include "school/includes/social_metadata.html" %}
  <title>{{ page.seo_title|default:page.title }} — SmartChild-School</title>
  <link rel="stylesheet" href="{% static 'school/css/site.css' %}">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/">SmartChild-School</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">SmartChild-School · учебные материалы для самостоятельного изучения</footer>

  <script src="{% static 'school/js/lesson-tabs.js' %}" defer></script>
</body>

</html>
