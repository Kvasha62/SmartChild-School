{% load static wagtailcore_tags %}
<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="{{ page.search_description|default:'Учебные материалы SmartChild-School по программированию и подготовке к ОГЭ и ЕГЭ.' }}">
  <title>{{ page.seo_title|default:page.title }} — SmartChild-School</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f8fb;
    }

    body {
      margin: 0;
      line-height: 1.6;
    }

    .site-header,
    main,
    .site-footer {
      width: min(100% - 2rem, 58rem);
      margin-inline: auto;
    }

    .site-header {
      padding-block: 1.25rem;
      border-bottom: 1px solid #dce3ec;
    }

    .brand {
      color: inherit;
      font-weight: 750;
      text-decoration: none;
    }

    main {
      min-height: 65vh;
      padding-block: 2rem 4rem;
    }

    /* Расширенная область только для страниц уроков */
    main:has(.lesson-page) {
      width: min(100% - 2rem, 78rem);
    }

    /* Видео занимает всю доступную ширину */
    .lesson-page .lesson-video {
      width: 100%;
      max-width: none;
      margin: 28px 0;
      aspect-ratio: 16 / 9;
    }

    .lesson-page .lesson-video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    h1,
    h2,
    h3 {
      line-height: 1.2;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
    }

    .eyebrow {
      color: #52627a;
      font-size: .875rem;
      font-weight: 650;
    }

    .directions {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-block: 2rem;
    }

    .directions a {
      padding: .45rem .8rem;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      color: #172033;
      text-decoration: none;
    }

    .directions a[aria-current="page"] {
      background: #172033;
      color: white;
      border-color: #172033;
    }

    .lesson-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
      gap: 1rem;
      padding: 0;
      list-style: none;
    }

    .lesson-card {
      height: 100%;
      box-sizing: border-box;
      padding: 1.25rem;
      background: white;
      border: 1px solid #dce3ec;
      border-radius: .75rem;
    }

    .lesson-card h3 {
      margin-block: .5rem;
    }

    a {
      color: #174ea6;
    }

    .lesson-intro {
      font-size: 1.15rem;
      color: #52627a;
    }

    .lesson-body {
      overflow-wrap: anywhere;
    }

    /* Видео в уроках */
    .lesson-video {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      margin: 28px auto;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .lesson-video iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      .lesson-video {
        margin: 20px 0;
        border-radius: 8px;
      }
    }

    .lesson-body img {
      max-width: 100%;
      height: auto;
    }

    .empty-state {
      padding: 1rem;
      border-left: 3px solid #cbd5e1;
      background: white;
    }

    .site-footer {
      border-top: 1px solid #dce3ec;
      padding-block: 1rem 2rem;
      color: #52627a;
      font-size: .9rem;
    }

    .lesson-stream {
  display: grid;
  gap: 1.25rem;
}

.lesson-stream-block {
  min-width: 0;
}

.lesson-stream-block > *:first-child {
  margin-top: 0;
}

.lesson-stream-block > *:last-child {
  margin-bottom: 0;
}

.lesson-body pre {
  max-width: 100%;
  overflow-x: auto;
}

.lesson-accordion {
  border: 1px solid #dce3ec;
  border-radius: .75rem;
  background: white;
  overflow: hidden;
}

.lesson-accordion summary {
  padding: 1rem 1.25rem;
  cursor: pointer;
  font-weight: 650;
}

.lesson-accordion summary:focus-visible,
.lesson-tabs__button:focus-visible {
  outline: 3px solid #174ea6;
  outline-offset: 3px;
}

.lesson-accordion__content {
  padding: 0 1.25rem 1.25rem;
}

.lesson-callout {
  padding: 1rem 1.25rem;
  border-left: 4px solid #64748b;
  border-radius: .25rem;
  background: white;
}

.lesson-callout > strong {
  display: block;
  margin-bottom: .35rem;
}

.lesson-callout--info {
  border-color: #2563eb;
  background: #eff6ff;
}

.lesson-callout--important {
  border-color: #7c3aed;
  background: #f5f3ff;
}

.lesson-callout--warning {
  border-color: #d97706;
  background: #fffbeb;
}

.lesson-tabs {
  min-width: 0;
  border: 1px solid #dce3ec;
  border-radius: .75rem;
  background: white;
  overflow: hidden;
}

.lesson-tabs__buttons {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  padding: .75rem;
  border-bottom: 1px solid #dce3ec;
  background: #f6f8fb;
}

.lesson-tabs__button {
  padding: .55rem .9rem;
  border: 1px solid transparent;
  border-radius: .5rem;
  background: transparent;
  color: #172033;
  font: inherit;
  cursor: pointer;
}

.lesson-tabs__button[aria-selected="true"] {
  border-color: #cbd5e1;
  background: white;
  font-weight: 650;
}

.lesson-tabs__panel {
  padding: 1.25rem;
  overflow-wrap: anywhere;
}

.lesson-tabs__panel[hidden] {
  display: none;
}

.lesson-tabs__panel img {
  max-width: 100%;
  height: auto;
}
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/">SmartChild-School</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">SmartChild-School · учебные материалы для самостоятельного изучения</footer>

  <script>
    document.querySelectorAll("[data-lesson-tabs]").forEach((group) => {
      const buttons = Array.from(
        group.querySelectorAll("[data-tab-button]")
      );
      const panels = Array.from(
        group.querySelectorAll("[data-tab-panel]")
      );

      function activate(index, moveFocus = false) {
        buttons.forEach((button, i) => {
          const active = i === index;
          button.setAttribute("aria-selected", String(active));
          button.tabIndex = active ? 0 : -1;
          panels[i].hidden = !active;
        });

        if (moveFocus) {
          buttons[index].focus();
        }
      }

      buttons.forEach((button, index) => {
        button.addEventListener("click", () => activate(index));

        button.addEventListener("keydown", (event) => {
          let next = index;

          if (event.key === "ArrowRight") {
            next = (index + 1) % buttons.length;
          } else if (event.key === "ArrowLeft") {
            next = (index - 1 + buttons.length) % buttons.length;
          } else if (event.key === "Home") {
            next = 0;
          } else if (event.key === "End") {
            next = buttons.length - 1;
          } else {
            return;
          }

          event.preventDefault();
          activate(next, true);
        });
      });
    });
  </script>
</body>

</html>
