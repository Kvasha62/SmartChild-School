server {
    listen 80;
    server_name _;
    server_tokens off;

    # Wagtail allows 10 MiB images by default. This proxy ceiling also applies
    # to documents; revisit it when the product upload limit is agreed.
    client_max_body_size 20m;

    # Serve only generated renditions publicly. Original uploads and all other
    # /media paths stay private; Wagtail's /documents/ view enforces permissions.
    location ^~ /media/original_images/ {
        return 404;
    }

    location ^~ /media/images/ {
        alias /var/www/media/images/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
    }

    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward the TLS status from the trusted TLS ingress. Do not expose
        # this proxy publicly unless the ingress overwrites this header.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
