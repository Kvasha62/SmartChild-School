name: Django and Wagtail CI

on:
  pull_request:
  push:
    branches:
      - main
      - "tech-001/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: smartchild_test
          POSTGRES_USER: smartchild
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U smartchild -d smartchild_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "false"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: smartchild_test
      DB_USER: smartchild
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl libbz2-dev libexpat1-dev libffi-dev libgdbm-dev liblzma-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev uuid-dev zlib1g-dev
      - name: Build the exact Python baseline from official source
        run: |
          curl --fail --location --silent --show-error https://www.python.org/ftp/python/3.13.17/Python-3.13.17.tar.xz --output Python-3.13.17.tar.xz
          echo "6020bd10aff3bf4821be16f088ebb1591beb7b811dcd8fab1da8f7c22a7b27e7  Python-3.13.17.tar.xz" | sha256sum --check
          tar -xf Python-3.13.17.tar.xz
          cd Python-3.13.17
          ./configure --prefix="$HOME/.local/python-3.13.17" --with-ensurepip=install
          make -j2
          make altinstall
          ln -s python3.13 "$HOME/.local/python-3.13.17/bin/python"
          echo "$HOME/.local/python-3.13.17/bin" >> "$GITHUB_PATH"
          "$HOME/.local/python-3.13.17/bin/python3.13" --version
      - name: Install fully pinned dependency lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build production container image
        run: docker build --pull --tag smartchild-school-ci .

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Validate Caddy configuration
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e PUBLIC_DOMAIN=example.test caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Smoke test production database role, migrations and health check
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-name smartchild-ci --env-file .env.production.example -f compose.production.yml)
          cleanup() { "${compose[@]}" down --volumes --remove-orphans; }
          trap cleanup EXIT
          "${compose[@]}" up -d db
          "${compose[@]}" run --rm web python manage.py migrate --noinput
          "${compose[@]}" up -d web
          container_id=$("${compose[@]}" ps -q web)
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)
            [[ "$state" == "healthy" ]] && break
            sleep 2
          done
          state=$(docker inspect --format='{{.State.Health.Status}}' "$container_id")
          test "$state" = "healthy"
          role_is_superuser=$("${compose[@]}" exec -T db psql -U smartchild_admin -d smartchild -tAc "SELECT rolsuper FROM pg_roles WHERE rolname = 'smartchild_app'")
          test "$role_is_superuser" = "f"

      - name: Check Django and Wagtail configuration
        run: python manage.py check
      - name: Check for uncommitted model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply database migrations
        run: python manage.py migrate --noinput
      - name: Run automated tests
        run: python manage.py test
      - name: Check production deployment settings
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.test
          WAGTAILADMIN_BASE_URL: https://example.test
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "true"
          EMAIL_USE_SSL: "false"
          DEFAULT_FROM_EMAIL: "SmartChild <noreply@example.test>"
          SERVER_EMAIL: "SmartChild <server@example.test>"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "false"
          DJANGO_TRUST_X_FORWARDED_PROTO: "true"
        run: python manage.py check --deploy

      - name: Confirm migration state is clean
        run: python manage.py migrate --check
