name: Django and Wagtail CI

on:
  pull_request:
  push:
    branches:
      - main
      - "tech-001/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: smartchild_test
          POSTGRES_USER: smartchild
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartchild -d smartchild_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-but-long-enough-for-tests
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      WAGTAILADMIN_BASE_URL: http://localhost:8000
      DB_NAME: smartchild_test
      DB_USER: smartchild
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl libbz2-dev libexpat1-dev libffi-dev libgdbm-dev liblzma-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev uuid-dev zlib1g-dev

      - name: Build the exact Python baseline from official source
        run: |
          curl --fail --location --silent --show-error https://www.python.org/ftp/python/3.13.17/Python-3.13.17.tar.xz --output Python-3.13.17.tar.xz
          echo "6020bd10aff3bf4821be16f088ebb1591beb7b811dcd8fab1da8f7c22a7b27e7  Python-3.13.17.tar.xz" | sha256sum --check
          tar -xf Python-3.13.17.tar.xz
          cd Python-3.13.17
          ./configure --prefix="$HOME/.local/python-3.13.17" --with-ensurepip=install
          make -j2
          make altinstall
          ln -s python3.13 "$HOME/.local/python-3.13.17/bin/python"
          echo "$HOME/.local/python-3.13.17/bin" >> "$GITHUB_PATH"
          "$HOME/.local/python-3.13.17/bin/python3.13" --version

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check development settings
        run: python manage.py check

      - name: Check production settings contract and static manifest
        env:
          DJANGO_SETTINGS_MODULE: config.production_settings
          DJANGO_SECRET_KEY: ci-only-synthetic-production-key-for-checks-0123456789abcdef
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: school.example.invalid
          WAGTAILADMIN_BASE_URL: https://school.example.invalid
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_MEDIA_ROOT: ${{ runner.temp }}/smartchild-media
          DB_NAME: smartchild_test
          DB_USER: smartchild_app
          DB_PASSWORD: ci-only-app-password-012345
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DJANGO_EMAIL_HOST: smtp.example.invalid
          DJANGO_EMAIL_HOST_USER: mailer@example.invalid
          DJANGO_EMAIL_HOST_PASSWORD: ci-only-mail-password-012345
          DJANGO_DEFAULT_FROM_EMAIL: no-reply@example.invalid
          DJANGO_TRUST_PROXY_SSL_HEADER: "true"
        run: |
          python manage.py check --deploy --fail-level ERROR --settings=config.production_settings
          python manage.py collectstatic --noinput --settings=config.production_settings
          test -f staticfiles/staticfiles.json

      - name: Check for uncommitted model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run automated tests
        run: python manage.py test

      - name: Confirm migration state is clean
        run: python manage.py migrate --check

      - name: Build and smoke-test hardened production Compose stack
        run: |
          set -euo pipefail
          cat > .env <<'ENVVARS'
          DJANGO_SETTINGS_MODULE=config.production_settings
          DJANGO_SECRET_KEY=ci-only-synthetic-production-key-for-docker-smoke-0123456789abcdef
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=ci.example.invalid,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS=https://ci.example.invalid
          WAGTAILADMIN_BASE_URL=https://ci.example.invalid
          DJANGO_MEDIA_ROOT=/srv/media
          DB_NAME=smartchild_ci
          DB_ADMIN_USER=smartchild_admin
          DB_ADMIN_PASSWORD=ci-only-admin-password-012345
          DB_USER=smartchild_app
          DB_PASSWORD=ci-only-app-password-012345
          DB_HOST=db
          DB_PORT=5432
          DB_CONN_MAX_AGE=60
          DJANGO_EMAIL_HOST=smtp.example.invalid
          DJANGO_EMAIL_PORT=587
          DJANGO_EMAIL_USE_TLS=true
          DJANGO_EMAIL_USE_SSL=false
          DJANGO_EMAIL_HOST_USER=mailer@example.invalid
          DJANGO_EMAIL_HOST_PASSWORD=ci-only-mail-password-012345
          DJANGO_DEFAULT_FROM_EMAIL=no-reply@example.invalid
          DJANGO_TRUST_PROXY_SSL_HEADER=true
          DJANGO_SECURE_SSL_REDIRECT=true
          DJANGO_SECURE_HSTS_SECONDS=3600
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=false
          DJANGO_SECURE_HSTS_PRELOAD=false
          DJANGO_LOG_LEVEL=INFO
          HTTP_BIND_ADDRESS=127.0.0.1
          HTTP_PORT=8080
          ENVVARS
          set -a
          source .env
          set +a

          docker compose -f compose.production.yml config --quiet
          docker build --tag smartchild-school:ci .

          # Migrations are explicit; the app process never applies them at startup.
          docker compose -f compose.production.yml run --rm app python manage.py migrate --noinput
          docker compose -f compose.production.yml up -d

          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error -H "Host: ci.example.invalid" -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/health/ready/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          # The application source is root-owned/read-only; its DB role is not an admin.
          if docker compose -f compose.production.yml exec -T app python -c "open('/app/.ci-write-test', 'w').close()"; then
            echo "Application code directory unexpectedly writable." >&2
            exit 1
          fi
          if docker compose -f compose.production.yml exec -T app python -c "open('/var/tmp/.ci-rootfs-write-test', 'w').close()"; then
            echo "Container root filesystem unexpectedly writable." >&2
            exit 1
          fi
          superuser_flags="$(docker compose -f compose.production.yml exec -T db psql -U "$DB_ADMIN_USER" -d "$DB_NAME" -Atqc "SELECT (rolsuper OR rolcreatedb OR rolcreaterole)::text FROM pg_roles WHERE rolname='$DB_USER'")"
          echo "$superuser_flags" | grep -Eq '^(f|false)$'

          # Seed existing synthetic files so the media access policy is exercised.
          docker compose -f compose.production.yml exec -T app python -c "import os; base='/srv/media'; os.makedirs(base + '/images', exist_ok=True); os.makedirs(base + '/original_images', exist_ok=True); os.makedirs(base + '/documents', exist_ok=True); open(base + '/images/smoke-public.txt', 'w').write('synthetic public rendition'); open(base + '/original_images/smoke-private.txt', 'w').write('synthetic private original'); open(base + '/documents/smoke-private.txt', 'w').write('synthetic private document')"

          headers=(-H "Host: ci.example.invalid" -H "X-Forwarded-Proto: https")
          curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/health/live/ >/dev/null
          curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/health/ready/ >/dev/null
          curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error --location "${headers[@]}" http://127.0.0.1:8080/cms/login/ -o /tmp/smartchild-login.html

          static_path="$(grep -o '/static/[^" ]*' /tmp/smartchild-login.html | head -n 1 || true)"
          test -n "$static_path"
          curl --fail --silent --show-error "${headers[@]}" "http://127.0.0.1:8080${static_path}" -o /dev/null

          public_media="$(curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/media/images/smoke-public.txt)"
          test "$public_media" = "synthetic public rendition"
          original_status="$(curl --silent --output /dev/null --write-out "%{http_code}" "${headers[@]}" http://127.0.0.1:8080/media/original_images/smoke-private.txt)"
          document_status="$(curl --silent --output /dev/null --write-out "%{http_code}" "${headers[@]}" http://127.0.0.1:8080/media/documents/smoke-private.txt)"
          test "$original_status" = "404"
          test "$document_status" = "404"

          docker compose -f compose.production.yml restart app
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/health/ready/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          public_media="$(curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/media/images/smoke-public.txt)"
          test "$public_media" = "synthetic public rendition"
          curl --fail --silent --show-error "${headers[@]}" http://127.0.0.1:8080/ >/dev/null

      - name: Tear down production Compose smoke test
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose -f compose.production.yml down --volumes --remove-orphans
          fi
